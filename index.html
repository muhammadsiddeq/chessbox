<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chessboard - HTML, CSS & JS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2rem;
      color: #38bdf8;
    }

    #status {
      margin-bottom: 16px;
      font-size: 1.15rem;
      font-weight: 600;
      background: #1e293b;
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid #334155;
      color: #facc15;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 64px);
      grid-template-rows: repeat(8, 64px);
      border: 6px solid #78350f;
      border-radius: 6px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    .square {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease;
    }

    .light {
      background-color: #f0d9b5;
      color: #1e293b;
    }

    .dark {
      background-color: #b58863;
      color: #0f172a;
    }

    .selected {
      background-color: #4ade80 !important;
    }

    button {
      margin-top: 18px;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: bold;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #2563eb;
    }

    @media (max-width: 560px) {
      .board {
        grid-template-columns: repeat(8, 42px);
        grid-template-rows: repeat(8, 42px);
      }
      .square {
        width: 42px;
        height: 42px;
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>

  <h1>♟️ Chessboard</h1>
  <div id="status">Turn: White</div>
  <div class="board" id="board"></div>
  <button id="resetBtn">Reset Board</button>

  <script>
    const boardEl = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');

    const initialBoard = [
      ['♜', '♞', '♝', '♛', '♚', '♝', '♞', '♜'],
      ['♟', '♟', '♟', '♟', '♟', '♟', '♟', '♟'],
      ['',  '',  '',  '',  '',  '',  '',  ''],
      ['',  '',  '',  '',  '',  '',  '',  ''],
      ['',  '',  '',  '',  '',  '',  '',  ''],
      ['',  '',  '',  '',  '',  '',  '',  ''],
      ['♙', '♙', '♙', '♙', '♙', '♙', '♙', '♙'],
      ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖']
    ];

    const whitePieces = new Set(['♖', '♘', '♗', '♕', '♔', '♙']);
    const blackPieces = new Set(['♜', '♞', '♝', '♛', '♚', '♟']);

    let state = initialBoard.map(row => [...row]);
    let selected = null;
    let turn = 'white';

    function isWhite(piece) {
      return whitePieces.has(piece);
    }

    function isBlack(piece) {
      return blackPieces.has(piece);
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const sq = document.createElement('div');
          sq.classList.add('square');
          sq.classList.add((row + col) % 2 === 0 ? 'light' : 'dark');
          sq.dataset.row = row;
          sq.dataset.col = col;
          sq.textContent = state[row][col];

          if (selected && selected.row === row && selected.col === col) {
            sq.classList.add('selected');
          }

          sq.addEventListener('click', () => handleSquareClick(row, col));
          boardEl.appendChild(sq);
        }
      }
      statusEl.textContent = `Turn: ${turn === 'white' ? 'White' : 'Black'}`;
    }

    function handleSquareClick(row, col) {
      const clickedPiece = state[row][col];

      // Agar koi piece pehle se select hai
      if (selected) {
        const fromPiece = state[selected.row][selected.col];

        // Apne hi doosre piece par click kiya to selection badal do
        if ((turn === 'white' && isWhite(clickedPiece)) || (turn === 'black' && isBlack(clickedPiece))) {
          selected = { row, col };
          renderBoard();
          return;
        }

        // Piece move karo
        state[row][col] = fromPiece;
        state[selected.row][selected.col] = '';
        selected = null;
        turn = turn === 'white' ? 'black' : 'white';
        renderBoard();
        return;
      }

      // Naya piece select karo agar uski turn ho
      if ((turn === 'white' && isWhite(clickedPiece)) || (turn === 'black' && isBlack(clickedPiece))) {
        selected = { row, col };
        renderBoard();
      }
    }

    resetBtn.addEventListener('click', () => {
      state = initialBoard.map(row => [...row]);
      selected = null;
      turn = 'white';
      renderBoard();
    });

    renderBoard();
  </script>

</body>
</html>
